name: CI

# Third-party actions are pinned by commit hash, not by movable tag: a tag such as
# @v4 or :latest can be rewritten upstream, which would reintroduce unreviewed code
# into a chain that, for a security tool, must stay reproducible.
# The comment keeps the version readable; Dependabot bumps the hash (.github/dependabot.yml).
#
# One pin is on its own: the actionlint container below is pinned by image digest, and
# Dependabot will not refresh it. Its GitHub Actions parser skips any `uses:` value starting
# with "docker://" before it looks at anything else (dependabot-core,
# github_actions/lib/dependabot/github_actions/file_parser.rb), which is also why that step
# never appeared in the three bump pull requests that pinned the actions above. Refreshing
# it is a manual step -- and it was already manual when it said ":1.7.12", except that a tag
# can be moved under us without the file changing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, whose publishing job waits on it. Nothing used to require a tag
  # to name a commit these checks had run on: this workflow does not trigger on tags, and
  # the release job referred to no run of it. Calling the workflow rather than restating its
  # jobs over there keeps one definition of what CI is -- a second copy is exactly the drift
  # DET-SCRIPTS describes.
  workflow_call:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

# What the token these jobs run with may do. Without this block they took the repository
# default, which is set in a web page, differs on a fork, and cannot be read from here.
# Reading the code is all any of them does -- the artifacts they upload travel on the
# Actions runtime token, not on this one.
permissions:
  contents: read

jobs:
  lint-workflows:
    # An invalid workflow fails at startup, with no job and no readable log.
    # Validating it here avoids diagnosing blind. Same check runs locally
    # via scripts/verify.ps1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The digest of the OCI index for rhysd/actionlint:1.7.12, read from the registry
      # rather than copied from anywhere: `docker-content-digest` on the manifest request,
      # confirmed against the Docker Hub tag API. The runner passes everything after
      # "docker://" straight to `docker pull`, so a digest reference is resolved by Docker
      # itself and a moved tag can no longer change what lints these files.
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  test:
    # These tests only touch Rempart.Core and replay snapshots:
    # they need no Windows machine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Unit and fixture-replay tests
        run: >
          dotnet test tests/Rempart.Tests.Unit --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/coverage.runsettings
          --results-directory artifacts/coverage

      - name: Coverage summary
        # Measured, never gated: this step has no threshold and cannot turn the job red.
        # It runs even after a failing test — the report is still written, and what was
        # covered on the way to the failure is worth reading.
        if: always()
        shell: pwsh
        run: ./scripts/coverage-summary.ps1 -ResultsDirectory artifacts/coverage

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-cobertura
          path: artifacts/coverage/**/coverage.cobertura.xml

  test-windows:
    # The Rempart.Windows layer -- P/Invoke, registry -- can only be tested on
    # Windows. A wrong P/Invoke signature is invisible at compile time: it returns
    # a plausible, silently wrong value.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Tests against the real registry and system APIs
        run: >
          dotnet test tests/Rempart.Tests.Windows --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/coverage.windows.runsettings
          --results-directory artifacts/coverage-windows

      - name: Coverage summary
        # Rempart.Windows can only be measured here: the Linux job does not compile it, so
        # until this step existed the layer this repository calls its least tested was also
        # the one nobody counted. Same script as the Linux job, one parameter apart -- a
        # second summariser would be the divergence DET-SCRIPTS describes.
        # Measured, never gated: no threshold, and it cannot turn the job red.
        if: always()
        shell: pwsh
        run: >
          ./scripts/coverage-summary.ps1
          -ResultsDirectory artifacts/coverage-windows
          -Package Rempart.Windows

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-cobertura-windows
          path: artifacts/coverage-windows/**/coverage.cobertura.xml

  publish-aot:
    # Verifies the actual deliverable: a single binary, no runtime to install.
    # Windows runners already carry the MSVC linker that Native AOT requires.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Native AOT publish
        run: dotnet publish src/Rempart.Cli --configuration Release

      - name: Check the binary runs without dependencies
        shell: pwsh
        run: |
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          if (-not (Test-Path $exe)) { throw "Binary missing: $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "rempart.exe = $size MB"
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "rempart version failed" }

      - name: Real scan on the runner
        shell: pwsh
        run: |
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          & $exe scan
          # 0 = saw everything, 3 = a collector was refused, 5 = a control could not be
          # evaluated. All three are acceptable *here*: what this step proves is that the
          # published binary runs a scan end to end, not that the runner is well configured.
          # 5 is the ordinary case, not the edge one -- WIN-ENC-001 (BitLocker) comes back
          # unverifiable even from an elevated console when the WMI class is absent, so
          # elevating the runner would not turn this into a 0. Narrowing the set back to
          # {0, 3} after elevating would redden a correct build.
          if ($LASTEXITCODE -notin @(0, 3, 5)) { throw "rempart scan failed ($LASTEXITCODE)" }

      - name: A line the tool cannot honour scans nothing
        shell: pwsh
        run: |
          # DET-OPTION-INCONNUE, on the binary. Usage.Check is a pure function of Core and
          # every test of it passes with the call missing from Program.cs -- which this job
          # is the only one to compile. Two single-token mutations there reopen the defect
          # end to end with the whole suite green: dropping the `return` from the refusal
          # branch printed « Rien n'a été exécuté » and then scanned the machine anyway,
          # and handing the check the exempted command word rescanned it silently. No
          # textual guard substitutes for running the thing. Both spellings of the same
          # sentence: the option that does not exist -- the replay option is `--from` --
          # and the capture path typed without it.
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          & $exe scan --replay nowhere.json
          if ($LASTEXITCODE -ne 6) { throw "an unknown option was not refused ($LASTEXITCODE)" }

          & $exe scan nowhere.json
          if ($LASTEXITCODE -ne 6) { throw "a bare argument was not refused ($LASTEXITCODE)" }

      - name: WMI responds from the AOT binary
        shell: pwsh
        run: |
          # The Windows tests run under JIT, where COM interop behaves differently.
          # An interop bug once left WMI dead in the published binary with nothing
          # reporting it: the scan exited 0 and every WMI check came back
          # « non verifiable ».
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          & $exe diagnose-wmi
          if ($LASTEXITCODE -ne 0) { throw "WMI does not respond from the AOT binary" }

      - name: Task Scheduler responds from the AOT binary
        shell: pwsh
        run: |
          # Same risk as WMI, and for the same reason: the Task Scheduler COM
          # interop is generated at compile time and its interfaces derive from
          # IDispatch. A one-slot vtable offset shows up neither at compile time
          # nor under JIT -- only here. A scan finding no tasks at all would
          # render a healthy-looking report.
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          & $exe diagnose-tasks
          if ($LASTEXITCODE -ne 0) { throw "Task Scheduler does not respond from the AOT binary" }

      - name: Loaded drivers enumerate from the AOT binary
        shell: pwsh
        run: |
          # The driver table is the surface a BYOVD attack lands on, so an empty
          # enumeration reads as a clean kernel rather than as a failed read. The rows
          # come from WMI and are then filtered on State and PathName: a VARIANT decode
          # that comes back plausible and wrong on either property empties the list
          # without failing anything. DET-WMI-MUET gave the read a status channel; this
          # is what makes the failure visible before a user meets it.
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          & $exe diagnose-drivers
          if ($LASTEXITCODE -ne 0) { throw "Loaded drivers do not enumerate from the AOT binary" }

      - name: Running processes enumerate from the AOT binary
        shell: pwsh
        run: |
          # Same failure as the drivers, same silence: no machine runs zero processes,
          # so an empty inventory can only be a failed read. The command also checks that
          # the enumeration finds itself, which holds the ProcessId decode -- it yields 0
          # when parsing fails -- and proves the query covers this machine.
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          & $exe diagnose-processes
          if ($LASTEXITCODE -ne 0) { throw "Running processes do not enumerate from the AOT binary" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rempart-win-x64
          path: src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe

  fixtures-anonymised:
    # Dedicated guardrail: a raw capture committed by mistake would expose a real
    # machine's inventory. The test also exists in the suite, but a separate job
    # makes the failure readable without opening the logs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check fixture anonymisation
        run: >
          dotnet test tests/Rempart.Tests.Unit --configuration Release
          --filter "FullyQualifiedName~Versioned_fixtures_are_anonymised"
