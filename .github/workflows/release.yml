name: Release

# Third-party actions are pinned by commit hash, not by movable tag: a tag such as
# @v4 or :latest can be rewritten upstream, which would reintroduce unreviewed code
# into a chain that, for a security tool, must stay reproducible.
# The comment keeps the version readable; Dependabot bumps the hash (.github/dependabot.yml).

# The binary is built here rather than uploaded from a workstation: what ships should
# come from a place anyone can inspect, out of the commit the tag names.
#
# The release is left as a DRAFT on purpose. The stick is only a stick once it carries a
# seal signed by the publisher key (ADR-002), and that key does not belong in a GitHub
# secret -- a signing key held by the build system signs whatever the build system is
# told to. So the last two steps are the publisher's: seal, then publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        # Naming it as well as selecting it: the job refuses a tag that is not the ref the
        # run was started from, because the checks run on the commit that triggered the run
        # and that is the commit this workflow publishes.
        description: 'Tag to build a draft release from — must be the ref this run starts on'
        required: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

# Read at the file level, write only on the job that publishes. What the called workflow
# below inherits is therefore the read, whatever it declares for itself.
permissions:
  contents: read

jobs:
  # Nothing used to require a tag to name a commit the checks had run on. ci.yml triggers on
  # a push to main, on pull_request and on workflow_dispatch -- not on tags -- and this job
  # carried neither a needs: nor a test of its own: `git push origin v1.0.1` on any commit
  # assembled and drafted a release having run zero unit tests, zero Windows tests, and not
  # the fixtures-anonymised guard. A tag is cut on main in practice, which passed CI when it
  # was pushed; in practice is not a gate.
  #
  # Called rather than restated: one definition of what CI is, gating the one workflow that
  # publishes.
  ci:
    uses: ./.github/workflows/ci.yml

  stick:
    needs: ci
    runs-on: windows-latest
    # The only job here that writes anything, and the only one that needs to.
    permissions:
      contents: write
    steps:
      # The one place the tag expression is read, and it is bound to the environment rather
      # than written into a script: ${{ }} is substituted as raw text before pwsh parses the
      # line, so a tag holding a double quote closed the literal and ran whatever followed.
      # workflow_dispatch takes that tag as free text, and this is the only job here carrying
      # contents: write and a GH_TOKEN. Every later step reads the value back through
      # $env:TAG, where it is data and not source.
      - name: The tag must name a version
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REF: ${{ github.ref_name }}
        run: |
          # Checked here rather than deeper down: the two steps below build a file name and a
          # staging path out of this string, and the AOT publish between them costs four
          # minutes that a malformed tag should not spend. GitHub has no pattern constraint
          # to put on a workflow_dispatch input, so the shape is asserted in the job.
          $tag = $env:TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Tag rejected: '$tag'. Expected vX.Y.Z, optionally with a pre-release suffix such as -rc.1."
          }

          # The checks ran on the commit that started this run, and the checkout below takes
          # that same commit because it selects no ref. The tag input must therefore name the
          # ref the run was started from, or this job would publish one commit while having
          # tested another. Keeping the input rather than deriving everything from the ref is
          # deliberate: the one workflow that writes to the repository asks the publisher to
          # name what they are releasing, and disagreement stops the run.
          if ($tag -ne $env:REF) {
            throw "Tag '$tag' is not the ref this run was started from ('$env:REF'). Start the run from the tag itself: the checks run on the commit that triggered the run, and that is the commit this job publishes."
          }

          "TAG=$tag" >> $env:GITHUB_ENV

      # No ref: what is checked out is the commit that triggered the run, which is the commit
      # the ci job above ran its checks on. Naming a ref here is how the two come apart.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Native AOT publish
        run: dotnet publish src/Rempart.Cli --configuration Release

      - name: The binary must agree with the tag
        shell: pwsh
        run: |
          # <Version> in Directory.Build.props is the single source of the version, and it
          # had already drifted twice from what was actually shipped. A tag that disagrees
          # with the binary is caught here rather than by whoever runs "rempart version"
          # on the release and reads the wrong number.
          $exe = "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe"
          if (-not (Test-Path $exe)) { throw "Binary missing: $exe" }

          $tag = $env:TAG
          $expected = $tag -replace '^v', ''
          $reported = (& $exe version).Trim()

          Write-Host "tag=$tag  expected=$expected  rempart version=$reported"
          if ($reported -ne $expected) {
            throw "Version mismatch: tag says '$expected', binary says '$reported'. Bump <Version> in Directory.Build.props to match the tag."
          }

      - name: Assemble the stick
        shell: pwsh
        run: |
          # The layout M6 defined: the binary at the root, and nothing beside it that it
          # needs in order to run.
          #
          # The rules are deliberately NOT copied here, and this comment is the reason why.
          # The 82 shipped rules are compiled into the binary, so that the stick stays
          # self-contained; a rules/ directory found next to the executable is picked up as
          # an *external* catalogue, meant for fleet-specific checks. Copying the
          # repository's rules/ therefore handed the binary its own catalogue as a
          # third-party supplement: all 82 identifiers collided and RuleCatalog refused to
          # load, exactly as it is written to. That shipped as v1.0.0-rc.2, where scan,
          # explain and capture all stopped on the same error.
          $tag = $env:TAG
          $version = $tag -replace '^v', ''
          $stage = "stick/rempart-$version-win-x64"

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src/Rempart.Cli/bin/Release/net10.0-windows/win-x64/publish/rempart.exe" $stage

          # No -ErrorAction here, and the absence is the fix. A per-cmdlet -ErrorAction
          # outranks the $ErrorActionPreference = 'Stop' GitHub sets for shell: pwsh, so
          # SilentlyContinue let a renamed or missing file drop out of the archive with the
          # job still green -- the stick could be published without its licence. Let it stop
          # the run instead: a deliverable missing a file it is meant to carry is not a
          # release, and the parity guard next door only compares the two lists.
          Copy-Item "README.md", "LICENSE" $stage

          # "unsealed" is in the *file* name so this archive cannot be published by mistake
          # as if it were the real thing -- but never in the folder name inside it, which
          # survives sealing and would leave a sealed stick sitting in a directory labelled
          # unsealed. Hence archiving the staging folder itself rather than its contents.
          $zip = "rempart-$version-win-x64-unsealed.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          Write-Host "archive: $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
          "ZIP=$zip" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          "STAGE=$stage" >> $env:GITHUB_ENV

      - name: The assembled stick must run and scan
        shell: pwsh
        run: |
          # Run from the staging folder, not from the publish directory. That distinction is
          # the whole lesson of v1.0.0-rc.2: this step used to prove that a binary sitting
          # alone in its build output could scan, which is a shape nobody is ever shipped.
          # The one that ships is this folder, and it is the only one worth proving.
          $exe = Join-Path $env:STAGE "rempart.exe"
          & $exe scan
          # 0 = saw everything, 3 = a collector was refused, 5 = a control could not be
          # evaluated. All three are acceptable *here*: what this step proves is that the
          # shipped artifact runs a scan end to end, not that the runner is well configured.
          # 5 is the ordinary case, not the edge one -- WIN-ENC-001 (BitLocker) comes back
          # unverifiable even from an elevated console when the WMI class is absent, so
          # elevating the runner would not turn this into a 0. Narrowing the set back to
          # {0, 3} after elevating would redden a correct release.
          if ($LASTEXITCODE -notin @(0, 3, 5)) { throw "rempart scan failed ($LASTEXITCODE)" }

          # A catalogue collision does not need a machine to show itself, and explain is the
          # cheapest command that resolves one. Kept separate from the scan above so the
          # failure names which of the two broke.
          & $exe explain WIN-LEG-003 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "rempart explain failed ($LASTEXITCODE)" }

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:TAG

          # The release body is the CHANGELOG section for this version, not text written
          # here: the notes a reader gets and the notes the repository keeps should not be
          # two things that can disagree. The publisher checklist goes to the job summary
          # instead -- it is addressed to whoever is looking at this run, and would read
          # absurdly on a published release telling the public to seal the archive.
          $lines = Get-Content CHANGELOG.md
          $heading = '^##\s+' + [regex]::Escape($env:VERSION) + '(\s|$)'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $heading) { $start = $i; break }
          }

          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## $env:VERSION' section. Write the release notes before tagging."
          }

          $end = $lines.Count
          for ($j = $start + 1; $j -lt $lines.Count; $j++) {
            if ($lines[$j] -match '^##\s') { $end = $j; break }
          }

          $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          Set-Content -Path notes.md -Value $body -Encoding utf8

          # Single-quoted: a backtick is literal there, which is what markdown code spans
          # need. Interpolating them cost a mangled checklist on the first release.
          $checklist = @(
            '## This release is a draft, and the archive is unsealed',
            '',
            'It is not the deliverable yet:',
            '',
            '1. Download and unzip the attached archive.',
            '2. `rempart seal --dir <dossier> --key <publisher private key>`',
            "3. Re-zip the folder itself as ``rempart-$env:VERSION-win-x64.zip`` and attach it.",
            '4. Delete the `-unsealed` archive, then publish.',
            '',
            'A hash list sitting beside the files it describes protects nothing -- whoever',
            'edits a file recomputes the line. The signature is what makes the seal mean',
            'something, and the key that produces it is deliberately not available to CI.'
          ) -join "`n"

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $checklist -Encoding utf8

          # Built as an array: passing an empty string as an argument would send gh an
          # empty positional argument rather than nothing at all.
          $arguments = @($tag, $env:ZIP, '--draft', '--title', $tag, '--notes-file', 'notes.md')

          # A tag carrying a suffix (-rc.1, -beta) is a pre-release. Deriving it from the
          # tag rather than from a checkbox keeps the two from disagreeing.
          if ($tag -match '-') { $arguments += '--prerelease' }

          gh release create @arguments

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stick-unsealed
          path: ${{ env.ZIP }}
